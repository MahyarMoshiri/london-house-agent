    <title>London House Agent - Property Portfolio</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('__redirect');

        if (!redirectPath) {
          return;
        }

        var search = params.get('__search');
        var hash = params.get('__hash');

        params.delete('__redirect');
        params.delete('__search');
        params.delete('__hash');

        var basePath = window.location.pathname.replace(/\/*$/, '');
        var normalizedRedirect = redirectPath.startsWith('/') ? redirectPath : '/' + redirectPath;
        var target = basePath + normalizedRedirect;

        if (search) {
          target += '?' + search;
        }

        if (hash) {
          target += '#' + hash;
        }

        history.replaceState(null, '', target);
      })();
    </script>
